[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-attribution"
version = "0.1.0"
description = "Transparent multi-touch pipeline attribution: every dollar of credit traces to the touches behind it"
requires-python = ">=3.11"

[project.scripts]
pipeline-attribution = "pipeline_attribution.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
